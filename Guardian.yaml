tasks:
  code_generation: true
  code_completion: true
  code_review: true
  debugging: true
  testing: true
  refactoring: true
  documentation: true

code_generation:
  preferred_languages:
    - Python
    - Java
    - C++
  preferred_frameworks:
    - TensorFlow
    - PyTorch
    - Keras

code_completion:
  max_suggestions: 5
  min_confidence: 0.7

code_review:
  max_errors: 10
  min_confidence: 0.8

debugging:
  max_suggestions: 5
  min_confidence: 0.7
  enable_memory_debugging: true

testing:
  max_test_cases: 10
  min_confidence: 0.8
  enable_unit_testing: true

refactoring:
  max_suggestions: 5
  min_confidence: 0.7
  enable_code_refactoring: true

documentation:
  max_words: 500
  min_confidence: 0.8
  enable_documentation_generation: true

guardian_agent:
  enabled: true

  monitoring:
    monitor_system_calls: true
    monitor_network_connections: true
    monitor_agent_interactions: true

  threat_detection:
    enabled: true
    min_confidence: 0.8
    algorithms:
      - machine_learning
      - signature_based
      - anomaly_based
      - behavioral_based

  risk_assessment:
    enabled: true
    assess_inaction_risk: true  # agent evaluates risk of doing nothing
    min_confidence: 0.7
    risk_levels:
      - low
      - medium
      - high
      - critical
    escalate_on: high  # escalate when inaction risk reaches this level

  agent_termination:
    enabled: true
    terminate_malicious_agents: true
    require_confirmation: true
    auto_terminate_on_critical: true  # critical inaction risk bypasses confirmation

  system_protection:
    enabled: true
    block_sensitive_resource_access: true
    prevent_system_changes: true

  threat_quarantine:
    enabled: true
    directory: quarantine  # isolated holding area for threat evidence
    always: true  # quarantine every detected threat, not just terminated ones
    study_and_report: true  # trace provenance (origin) and report each quarantined threat

updates:
  auto_update: true  # always check for and apply updates automatically
  check_interval: 45m  # how often to check sources
  inbox: updates/inbox  # where incoming update packages land for the automatic sweep
  verify_signatures: true  # only apply cryptographically signed updates (authorization gate)
  rollback_on_failure: true  # restore previous version if an update fails

  sources:
    - centralized_server
    - cloud_services  # AWS, Azure, Google Cloud
    - peer_to_peer_network
    - local_sources  # local server, shared drive

  protocols:
    - https
    - sftp
    - ssh  # ftp removed: sends credentials in plaintext

  formats:
    - executable  # .exe
    - script  # .ps1, .sh
    - config  # .xml, .json
    - database  # .sql

todos:
  - task: alert_on_high_inaction_risk
    description: Send an alert when risk_assessment escalates at high (below the auto-terminate threshold)
    status: done  # send_alert() in guardian.py, called from run_cycle for non-critical escalations
  - task: test_rollback_on_failure
    description: Verify updates.rollback_on_failure restores the previous version correctly
    status: done  # backup snapshot covered in test_guardian.py; restore branch pending a real apply step (stub)
  - task: implement_signature_verification
    description: Enforce updates.verify_signatures before applying any update
    status: done  # verify_signature() gate in apply_update
  - task: document_guardian_config
    description: Keep README.md in sync with Guardian.yaml as the config evolves
    status: done  # README "Guardian configuration" section synced
  - task: quarantine_malicious_updates
    description: Quarantine suspicious updates in an isolated area before applying them
    status: done  # unsigned updates moved to quarantine/ in apply_update
  - task: audit_logging
    description: Log all Guardian actions (detections, escalations, terminations, updates) to an audit trail
    status: done  # implemented in guardian_audit.py
  - task: automatic_authorized_updates
    description: Wire updates.auto_update/check_interval so signed updates in the inbox are applied automatically
    status: done  # check_updates() in guardian.py sweeps updates/inbox through the signature-gated apply_update()
  - task: quarantine_and_report_threats
    description: Always quarantine detected threats, study them, trace their exact origin, and report
    status: done  # threat_quarantine section; quarantine_threat() + trace_provenance() in guardian.py
