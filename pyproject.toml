[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daigrin-guardian"
version = "1.0.0"
description = "Guardian — a defensive-only cyber-security supervisor for any OS and any device. Built to help people first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daigrin" }]
requires-python = ">=3.8"
keywords = ["security", "defensive", "guardian", "intrusion-detection", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# PyYAML is used when present; Guardian falls back to the vendored
# guardian_miniyaml loader, so there are no hard third-party dependencies.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
tray = ["pystray", "Pillow"]

[project.scripts]
guardian = "guardian:main"

[tool.setuptools]
py-modules = ["guardian", "guardian_audit", "guardian_miniyaml"]

[tool.setuptools.package-data]
guardian = ["Guardian.yaml"]
